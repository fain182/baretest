deptrac:
  paths:
    - src
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: ^Baretest\\Core\\.*
    - name: Cli
      collectors:
        - type: classLike
          value: ^Baretest\\Cli$
    - name: TestFileRepository
      collectors:
        - type: classLike
          value: ^Baretest\\TestFileRepository\\.*
    - name: Execution
      collectors:
        - type: classLike
          value: ^Baretest\\Execution\\.*
    - name: Report
      collectors:
        - type: classLike
          value: ^Baretest\\Report\\.*
    - name: Functions
      collectors:
        - type: functionName
          value: ^Baretest\\.*
  ruleset:
    Core: ~
    Cli: [Core, TestFileRepository, Execution, Report]
    TestFileRepository: [Core]
    Execution: [Core]
    Report: [Core]
    Functions: [Execution]

deptrac:
  paths:
    - src
  layers:
    - name: Core
      collectors:
        - type: classLike
          value: ^Baretest\\Core\\.*
    - name: Cli
      collectors:
        - type: classLike
          value: ^Baretest\\Cli$
    - name: Console
      collectors:
        - type: classLike
          value: ^Baretest\\Console\\.*
    - name: Ci
      collectors:
        - type: classLike
          value: ^Baretest\\Ci\\.*
    - name: Filesystem
      collectors:
        - type: classLike
          value: ^Baretest\\Filesystem\\.*
    - name: Process
      collectors:
        - type: classLike
          value: ^Baretest\\Process\\.*
    - name: Worker
      collectors:
        - type: classLike
          value: ^Baretest\\Worker\\.*
    - name: Functions
      collectors:
        - type: functionName
          value: ^Baretest\\.*
  ruleset:
    Core: ~
    Cli: [Core, Console, Ci, Filesystem, Process]
    Console: [Core]
    Ci: [Core]
    Filesystem: [Core]
    Process: [Core]
    Worker: [Core, Process]
    Functions: [Worker]
